[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptomamba"
version = "1.0.0"
description = "CryptoMamba reproduction: model, training, evaluation, chronological trading backtest"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.optional-dependencies]
# tests/test_thesis_*.py are written against pytest; the runtime deps do not include it.
dev = ["pytest"]

[tool.setuptools]
packages = ["models", "models.layers", "pl_modules", "data_utils", "utils", "thesis_pipeline"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
