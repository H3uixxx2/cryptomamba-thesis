[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptomamba"
version = "1.0.0"
description = "CryptoMamba reproduction: model, training, evaluation, chronological trading backtest"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.optional-dependencies]
# tests/test_thesis_*.py are written against pytest; the runtime deps do not include it.
dev = ["pytest"]
# Native Mamba kernels: Linux + CUDA only (Colab). Needed to TRAIN and to run the
# fused-kernel path; CPU inference falls back to models/cmamba.py::selective_scan_ref.
gpu = ["mamba-ssm[causal-conv1d]"]

[tool.setuptools]
packages = ["models", "pl_modules", "data_utils", "utils", "thesis_pipeline"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
