target: pl_modules.cmamba_t_module.CryptoMambaTModule
params:
    num_features: 5
    window_size: 60
    d_model: 32
    n_blocks: 4
    d_state: 16
    mlp_ratio: 2
    drop: 0.1
    mode: 'ret'
    loss: 'crps'
    distributional: True
    mixture: True
    # Blueprint §2: weight-shared reverse scan + regime gate + ECA, recency readout,
    # multi-timescale A init. All identity at init, so this starts as an exact copy of
    # t12 and diverges only through learned weights.
    bi_scan: True
    recency_pool: True
    timescale_init: True
normalize: False
